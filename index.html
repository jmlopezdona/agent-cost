<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Cost — Calculadora de costes de agentes de IA</title>
    <script>
      // Aplica el tema antes del primer paint para evitar parpadeo
      const stored = localStorage.getItem('agentcost-theme')
      const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)

      // Resuelve el idioma antes del primer paint (D6): preferencia guardada → navegador → inglés.
      // Misma precedencia que pickLocale() en src/i18n; fija <html lang> para evitar flash de idioma.
      const savedLang = localStorage.getItem('agentcost-lang')
      const nav = (navigator.language || '').toLowerCase()
      document.documentElement.lang =
        savedLang === 'es' || savedLang === 'en' || savedLang === 'fr'
          ? savedLang
          : nav.startsWith('es')
            ? 'es'
            : nav.startsWith('fr')
              ? 'fr'
              : 'en'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
